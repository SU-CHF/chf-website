- title: Financial Literacy in South Africa
  author:
  - Lwanga Elizabeth Nanziri
  - Matthew Olckers
  date: '2026'
  categories:
  - Financial information and advice
  description: '<span class="chf-status">working paper</span> We examine financial
    literacy in South Africa using a nationally representative survey conducted in
    2017 that includes standardized questions on financial literacy used in over 140
    countries. South Africa follows patterns found in other countries: less educated
    and low-income respondents display low levels of financial literacy. Most countries
    have large gender gaps in financial literacy while the gender gap is absent in
    South Africa. The absence of an aggregate gender gap masks two offsetting patterns.
    Men are more financially literate than their female partners, but single women
    are more financially literate than single men.'
