- title: Incentives to Offer Algorithmic Recourse
  author:
  - Matthew Olckers
  - Toby Walsh
  byline: Matthew Olckers and Toby Walsh
  date: '2026'
  categories:
  - Financial information and advice
  status: working paper
  description: 'Algorithmic recourse promises to help applicants rejected by automated
    systems by explaining the changes needed to secure acceptance. What incentive
    do decision-makers, such as banks and employers, have to offer recourse? We study
    this question in a screening model in which recourse is both productive and selective:
    completing recourse improves an applicant''s value to the decision-maker, but
    applicants differ in their cost of completion. The optimal policy is a threshold
    rule: reject applicants with low scores, offer recourse to an intermediate range
    of scores, and accept applicants with high scores outright. Because the intermediate
    range spans the cutoff that would separate acceptance from rejection when recourse
    is not available, some marginal applicants gain a new path to acceptance, while
    others---who would have been accepted outright---must now clear a costly hurdle.'
  chf_links:
  - label: Working paper
    url: https://arxiv.org/pdf/2301.12884

