# Governance document register. Rendered by chf_doc_list() in R/chf.R.
#
# PDFs live in documents/ and are named to the guidelines' convention:
#   CHF-[DocType]-[ShortTitle]-vX.Y.pdf
#
# Two rules the renderer enforces, so a broken download fails the build rather
# than reaching the site:
#   - the file named here must exist in documents/
#   - its filename must end in -v<version>.pdf, matching the `version:` field
#
# So add an entry only once its PDF is in documents/. An empty list renders a
# "no documents published yet" note.
#
# Fields: title, doctype, version, date (ISO), file, summary

